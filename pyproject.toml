[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenways-ble"
version = "0.3.1"
description = "Read-only BLE client, King Meter protocol and diagnostic CLI for TENWAYS e-bikes"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["tenways", "ebike", "bluetooth", "ble", "king-meter", "home-assistant"]
license = { text = "MIT" }
authors = [
  { name = "Christoph Berliner" }
]
dependencies = [
  "bleak>=0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/Styx85/tenways-ble"
Issues = "https://github.com/Styx85/tenways-ble/issues"

[project.scripts]
tenways = "tenways_ble.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tenways_ble"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
