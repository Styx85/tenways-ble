[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenways-ble"
version = "0.1.0"
description = "Minimal BLE client and diagnostic CLI for TENWAYS e-bikes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Christoph Berliner" }
]
dependencies = [
  "bleak>=0.22,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[project.scripts]
tenways = "tenways_ble.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tenways_ble"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
